pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://files.minecraftforge.net/maven/" }
        maven { url "https://maven.neoforged.net/releases/" }
        gradlePluginPortal()
    }
}

rootProject.name = 'yes_steve_model'

include 'common'
include 'neoforge'
// Forge 1.20.1 / Fabric 1.20.1 targets are parked while the project targets
// NeoForge 1.21.1 (Architectury's `minecraft` version is a single, project-wide
// setting, so 1.20.1 and 1.21.1 platforms cannot be built side by side here).
// Sources remain in forge/ and fabric/ for reference / a future re-split.
//include 'fabric'
//include 'forge'
